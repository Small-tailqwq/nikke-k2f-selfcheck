name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -v test_selfcheck

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"
          pyinstaller --onefile --console --clean --noconfirm --name k2f-selfcheck --add-data "k2f_targets.json;." k2f_selfcheck.py

      - name: Smoke test
        run: |
          .\dist\k2f-selfcheck.exe --quick --no-open --out smoke.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path smoke.html -Pattern 'id="summary"' -Quiet)) { exit 1 }

      - name: Checksum
        run: |
          $hash = (Get-FileHash dist\k2f-selfcheck.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  k2f-selfcheck.exe" | Out-File -Encoding ascii dist\k2f-selfcheck.exe.sha256
          Get-Content dist\k2f-selfcheck.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: k2f-selfcheck-windows
          path: |
            dist/k2f-selfcheck.exe
            dist/k2f-selfcheck.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: k2f-selfcheck-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" k2f-selfcheck.exe k2f-selfcheck.exe.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
